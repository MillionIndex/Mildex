<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member - MillionIndex</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --ocean:#1598b8;
    --ocean-blue:#54c8dc;
    --mint:#b9eee4;

    --text:#285264;
    --text-soft:#6b8994;
    --text-faint:#9bb4bc;

    --member-color:#1598b8;

    --shadow:0 15px 45px rgba(21,152,184,.09);
    --soft-shadow:0 8px 28px rgba(21,152,184,.07);

    --transition:all .4s cubic-bezier(.16,1,.3,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    line-height:1.8;
    overflow-x:hidden;

    background:
    linear-gradient(
        180deg,
        #fff 0%,
        #faffff 15%,
        #f1fcfd 34%,
        #e6f9fb 52%,
        #d5f4f3 72%,
        #bcece9 88%,
        #a9e5e5 100%
    );

    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================
   背景
========================= */

.background{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-10;
    overflow:hidden;
}

.background::before{
    content:"";

    position:absolute;

    width:650px;
    height:650px;

    top:-280px;
    right:-180px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(119,224,235,.30) 0%,
        rgba(119,224,235,.12) 38%,
        rgba(119,224,235,0) 72%
    );

    animation:floatCloud 12s ease-in-out infinite;
}

.background::after{
    content:"";

    position:absolute;

    width:720px;
    height:720px;

    bottom:-350px;
    left:-250px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.62) 0%,
        rgba(255,255,255,.20) 40%,
        rgba(255,255,255,0) 72%
    );

    animation:floatCloud 15s ease-in-out infinite reverse;
}

@keyframes floatCloud{

    0%,100%{
        transform:translate3d(0,0,0);
    }

    50%{
        transform:translate3d(20px,18px,0);
    }

}


/* =========================
   ロゴ
========================= */

.logo{
    position:fixed;

    top:17px;
    left:5%;

    z-index:1000;

    width:170px;
    height:78px;

    display:flex;
    align-items:center;
}

.logo img{
    display:block;

    width:auto;
    height:78px;

    object-fit:contain;

    transition:transform .35s ease;
}

.logo img:hover{
    transform:scale(1.04) rotate(-1deg);
}


/* =========================
   メニューボタン
========================= */

.menu-button{
    position:fixed;

    top:28px;
    right:5%;

    width:50px;
    height:50px;

    border:none;

    background:rgba(255,255,255,.70);

    border-radius:50%;

    cursor:pointer;

    z-index:1200;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:var(--transition);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
    0 8px 25px rgba(21,152,184,.09);
}

.menu-button:hover{
    transform:translateY(-2px) scale(1.04);
    background:rgba(255,255,255,.90);
}

.menu-icon{
    width:21px;
    height:16px;
    position:relative;
}

.menu-icon span{
    position:absolute;

    left:0;

    width:100%;
    height:2px;

    background:var(--text);

    border-radius:5px;

    transition:var(--transition);
}

.menu-icon span:nth-child(1){top:0}
.menu-icon span:nth-child(2){top:7px}
.menu-icon span:nth-child(3){top:14px}

.menu-button.active .menu-icon span:nth-child(1){
    top:7px;
    transform:rotate(45deg);
}

.menu-button.active .menu-icon span:nth-child(2){
    opacity:0;
}

.menu-button.active .menu-icon span:nth-child(3){
    top:7px;
    transform:rotate(-45deg);
}


/* =========================
   メニュー
========================= */

.menu{
    position:fixed;

    inset:0;

    z-index:1100;

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(248,254,255,.94);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    opacity:0;
    visibility:hidden;

    transition:var(--transition);
}

.menu.active{
    opacity:1;
    visibility:visible;
}

.menu-list{
    width:min(570px,82%);

    display:flex;

    flex-direction:column;

    gap:8px;
}

.menu-list a{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:18px 20px;

    color:var(--text);

    border-radius:20px;

    background:rgba(255,255,255,.42);

    opacity:0;

    transform:translateY(18px);

    transition:var(--transition);
}

.menu.active .menu-list a{
    opacity:1;
    transform:translateY(0);
}

.menu.active .menu-list a:nth-child(1){transition-delay:.05s}
.menu.active .menu-list a:nth-child(2){transition-delay:.10s}
.menu.active .menu-list a:nth-child(3){transition-delay:.15s}
.menu.active .menu-list a:nth-child(4){transition-delay:.20s}
.menu.active .menu-list a:nth-child(5){transition-delay:.25s}
.menu.active .menu-list a:nth-child(6){transition-delay:.30s}

.menu-item-text{
    display:flex;
    align-items:baseline;
    gap:13px;
}

.menu-jp{
    font-size:20px;
    font-weight:700;
}

.menu-en{
    color:rgba(21,152,184,.62);

    font-family:Arial,Helvetica,sans-serif;

    font-size:10px;

    font-weight:600;

    letter-spacing:2.8px;

    line-height:1;
}

.menu-arrow{
    color:var(--ocean);
    font-size:19px;
}

.menu-list a:hover{
    background:rgba(255,255,255,.82);
    transform:translateX(5px);
}


/* =========================
   メイン
========================= */

main{
    width:min(1000px,86%);

    margin:0 auto;

    padding-top:190px;
}


/* =========================
   戻る
========================= */

.back-top{
    margin-bottom:35px;
}

.back-link{
    display:inline-flex;

    align-items:center;

    gap:8px;

    color:var(--text-soft);

    font-size:12px;

    font-weight:600;

    transition:var(--transition);
}

.back-link:hover{
    color:var(--member-color);
    transform:translateX(-4px);
}


/* =========================
   プロフィール
========================= */

.profile{
    display:grid;

    grid-template-columns:420px 1fr;

    gap:65px;

    align-items:center;

    padding:45px;

    border-radius:36px;

    background:rgba(255,255,255,.50);

    border:
    1px solid
    color-mix(
        in srgb,
        var(--member-color) 22%,
        white
    );

    box-shadow:
    0 18px 55px
    color-mix(
        in srgb,
        var(--member-color) 12%,
        transparent
    );

    position:relative;

    overflow:hidden;

    animation:profileIn .7s cubic-bezier(.16,1,.3,1);
}

.profile::before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:4px;

    background:var(--member-color);

    opacity:.8;
}

@keyframes profileIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.profile-image{
    width:100%;
    height:390px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.profile-image img{
    width:100%;
    height:100%;

    object-fit:contain;

    transition:var(--transition);
}

.profile-image img:hover{
    transform:scale(1.03);
}

.profile-number{
    color:var(--member-color);

    font-family:Arial,Helvetica,sans-serif;

    font-size:11px;

    font-weight:700;

    letter-spacing:3px;

    margin-bottom:10px;
}

.profile-name{
    color:var(--text);

    font-size:clamp(34px,5vw,50px);

    font-weight:800;

    line-height:1.3;

    margin-bottom:8px;
}

.profile-role{
    color:var(--member-color);

    font-size:13px;

    font-weight:700;

    margin-bottom:25px;
}

.profile-text{
    color:var(--text-soft);

    font-size:13px;

    line-height:2.15;
}


/* =========================
   Q&A
========================= */

.questions-section{
    margin-top:90px;

    padding-bottom:100px;
}

.questions-heading{
    text-align:center;

    margin-bottom:38px;
}

.questions-en{
    color:var(--member-color);

    font-family:Arial,Helvetica,sans-serif;

    font-size:11px;

    font-weight:700;

    letter-spacing:4px;

    margin-bottom:8px;
}

.questions-heading h2{
    color:var(--text);

    font-size:clamp(27px,4vw,36px);

    font-weight:800;
}

.questions-heading p{
    margin-top:8px;

    color:var(--text-faint);

    font-size:11px;
}

.questions-list{
    display:flex;

    flex-direction:column;

    gap:13px;
}

.question-item{
    display:grid;

    grid-template-columns:55px 1fr;

    gap:20px;

    align-items:start;

    padding:25px 28px;

    border-radius:25px;

    background:rgba(255,255,255,.55);

    border:1px solid rgba(25,40,45,.12);

    box-shadow:var(--soft-shadow);

    transition:var(--transition);
}

.question-item:hover{
    transform:translateY(-3px);

    background:rgba(255,255,255,.78);

    border-color:
    color-mix(
        in srgb,
        var(--member-color) 25%,
        white
    );
}

.question-number{
    color:var(--member-color);

    font-family:Arial,Helvetica,sans-serif;

    font-size:10px;

    font-weight:700;

    letter-spacing:2px;

    padding-top:4px;
}

.question-content h3{
    color:var(--text);

    font-size:16px;

    font-weight:800;

    line-height:1.6;

    margin-bottom:7px;
}

.question-content p{
    color:var(--text-soft);

    font-size:12px;

    line-height:2;
}


/* =========================
   エラー
========================= */

.error{
    text-align:center;

    padding:80px 20px;
}

.error h1{
    font-size:32px;

    color:var(--text);

    margin-bottom:15px;
}

.error p{
    color:var(--text-soft);

    font-size:13px;

    margin-bottom:30px;
}


/* =========================
   フッター
========================= */

footer{
    padding:50px 7% 28px;

    background:rgba(255,255,255,.48);

    border-top:1px solid rgba(255,255,255,.72);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.footer-inner{
    width:min(1000px,100%);

    margin:0 auto;
}

.footer-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:40px;
}

.footer-name{
    color:var(--text);

    font-size:19px;

    font-weight:800;
}

.footer-copy{
    margin-top:3px;

    color:var(--text-faint);

    font-size:10px;
}

.footer-links{
    display:flex;

    flex-wrap:wrap;

    justify-content:flex-end;

    gap:17px;
}

.footer-links a{
    color:var(--text-soft);

    font-size:11px;

    transition:var(--transition);
}

.footer-links a:hover{
    color:var(--member-color);
}

.footer-bottom{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-top:38px;

    padding-top:17px;

    border-top:1px solid rgba(21,152,184,.10);

    color:var(--text-faint);

    font-size:9px;
}


/* =========================
   タブレット
========================= */

@media(max-width:800px){

    .logo{
        top:12px;
        left:20px;

        width:145px;
        height:62px;
    }

    .logo img{
        height:62px;
    }

    .menu-button{
        top:18px;
        right:20px;

        width:44px;
        height:44px;
    }

    main{
        width:86%;

        padding-top:140px;
    }

    .profile{
        grid-template-columns:1fr;

        gap:30px;

        padding:35px 28px;
    }

    .profile-image{
        height:330px;
    }

    .questions-section{
        margin-top:70px;
    }

}


/* =========================
   スマホ
========================= */

@media(max-width:560px){

    .logo{
        left:15px;
    }

    .menu-button{
        right:15px;
    }

    main{
        width:90%;

        padding-top:120px;
    }

    .profile{
        padding:30px 20px;

        border-radius:28px;
    }

    .profile-image{
        height:280px;
    }

    .profile-name{
        font-size:34px;
    }

    .question-item{
        grid-template-columns:1fr;

        gap:5px;

        padding:21px;
    }

    .question-number{
        padding-top:0;
    }

    .footer-top{
        flex-direction:column;
    }

    .footer-links{
        justify-content:flex-start;
    }

    .footer-bottom{
        flex-direction:column;

        align-items:flex-start;

        gap:5px;
    }

}

</style>
</head>


<body>

<div class="background"></div>


<!-- =========================
     ロゴ
========================= -->

<a href="index.html" class="logo">
    <img src="MillionIndex.png" alt="MillionIndex">
</a>


<!-- =========================
     メニューボタン
========================= -->

<button class="menu-button" id="menuButton" aria-label="メニュー">

    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>

</button>


<!-- =========================
     メニュー
========================= -->

<nav class="menu" id="menu">

    <div class="menu-list">

        <a href="index.html">
            <div class="menu-item-text">
                <span class="menu-jp">トップ</span>
                <span class="menu-en">TOP</span>
            </div>
            <span class="menu-arrow">→</span>
        </a>

        <a href="About.html">
            <div class="menu-item-text">
                <span class="menu-jp">私たちについて</span>
                <span class="menu-en">ABOUT</span>
            </div>
            <span class="menu-arrow">→</span>
        </a>

        <a href="Service.html">
            <div class="menu-item-text">
                <span class="menu-jp">サービス</span>
                <span class="menu-en">SERVICE</span>
            </div>
            <span class="menu-arrow">→</span>
        </a>

        <a href="Mem.html">
            <div class="menu-item-text">
                <span class="menu-jp">メンバー</span>
                <span class="menu-en">MEMBERS</span>
            </div>
            <span class="menu-arrow">→</span>
        </a>

        <a href="Contact.html">
            <div class="menu-item-text">
                <span class="menu-jp">お問い合わせ</span>
                <span class="menu-en">CONTACT</span>
            </div>
            <span class="menu-arrow">→</span>
        </a>

    </div>

</nav>


<!-- =========================
     メイン
========================= -->

<main>

    <div id="memberProfile"></div>

</main>


<!-- =========================
     フッター
========================= -->

<footer>

    <div class="footer-inner">

        <div class="footer-top">

            <div>

                <div class="footer-name">
                    MillionIndex
                </div>

                <div class="footer-copy">
                    © 2026 MillionIndex
                </div>

            </div>

            <div class="footer-links">

                <a href="index.html">トップ</a>
                <a href="About.html">私たちについて</a>
                <a href="Service.html">サービス</a>
                <a href="Mem.html">メンバー</a>
                <a href="Contact.html">お問い合わせ</a>

            </div>

        </div>

        <div class="footer-bottom">

            <span>MillionIndex</span>

            <span>Creative Digital Project</span>

        </div>

    </div>

</footer>


<!-- =========================
     Mem.js
========================= -->

<script src="Mem.js"></script>


<script>

/* =========================
   メニュー
========================= */

const menuButton = document.getElementById("menuButton");
const menu = document.getElementById("menu");

menuButton.addEventListener("click", () => {

    menuButton.classList.toggle("active");
    menu.classList.toggle("active");

});


document.querySelectorAll(".menu-list a").forEach(link => {

    link.addEventListener("click", () => {

        menuButton.classList.remove("active");
        menu.classList.remove("active");

    });

});


/* =========================
   メンバー取得
========================= */

const params = new URLSearchParams(window.location.search);

const memberId = params.get("member");

const memberProfile = document.getElementById("memberProfile");


/* =========================
   メンバーが存在しない場合
========================= */

if(
    typeof members === "undefined" ||
    !memberId ||
    !members[memberId]
){

    memberProfile.innerHTML = `

        <div class="error">

            <h1>メンバーが見つかりません</h1>

            <p>
                指定されたメンバーは存在しないか、
                URLが正しくありません。
            </p>

            <a
                href="Mem.html"
                class="back-link"
            >
                ← メンバー一覧へ戻る
            </a>

        </div>

    `;

}else{

    const member = members[memberId];


    /* =========================
       メンバーカラー
    ========================= */

    document.documentElement.style.setProperty(
        "--member-color",
        member.color || "#1598b8"
    );


    /* =========================
       プロフィール
    ========================= */

    memberProfile.innerHTML = `

        <div class="back-top">

            <a
                href="Mem.html"
                class="back-link"
            >
                ← メンバー一覧へ戻る
            </a>

        </div>


        <section class="profile">

            <div class="profile-image">

                <img
                    src="${member.image}"
                    alt="${member.name}"
                >

            </div>


            <div>

                <div class="profile-number">
                    MEMBER ${member.number}
                </div>

                <h1 class="profile-name">
                    ${member.name}
                </h1>

                <div class="profile-role">
                    ${member.role}
                </div>

                <p class="profile-text">
                    ${member.description}
                </p>

            </div>

        </section>


        <section class="questions-section">

            <div class="questions-heading">

                <div class="questions-en">
                    Q &amp; A
                </div>

                <h2>
                    ちょっと聞いてみました。
                </h2>

                <p>
                    ${member.name}について、いくつか質問してみました。
                </p>

            </div>


            <div class="questions-list">

                ${
                    Array.isArray(member.questions)
                    ?
                    member.questions.map((item,index) => `

                        <article class="question-item">

                            <div class="question-number">
                                Q${String(index + 1).padStart(2,"0")}
                            </div>

                            <div class="question-content">

                                <h3>
                                    ${item.question}
                                </h3>

                                <p>
                                    ${item.answer}
                                </p>

                            </div>

                        </article>

                    `).join("")
                    :
                    `
                        <article class="question-item">

                            <div class="question-number">
                                Q01
                            </div>

                            <div class="question-content">

                                <h3>
                                    Q&amp;A準備中
                                </h3>

                                <p>
                                    現在、質問を準備中です。
                                </p>

                            </div>

                        </article>
                    `
                }

            </div>

        </section>

    `;

}

</script>

</body>
</html>
