<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>メンバー一覧 | MillionIndex</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           基本設定
        ========================================================= */

        :root {
            --ocean: #1598b8;
            --ocean-blue: #54c8dc;
            --ocean-light: #9ce8ed;
            --mint: #b9eee4;

            --text: #285264;
            --text-soft: #6b8994;
            --text-faint: #9bb4bc;

            --white: #ffffff;

            --shadow:
                0 15px 45px rgba(21, 152, 184, 0.09);

            --soft-shadow:
                0 8px 28px rgba(21, 152, 184, 0.07);

            --transition:
                all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family:
                "Noto Sans JP",
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            color: var(--text);

            line-height: 1.8;

            overflow-x: hidden;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #faffff 15%,
                    #f1fcfd 34%,
                    #e6f9fb 52%,
                    #d5f4f3 72%,
                    #bcece9 88%,
                    #a9e5e5 100%
                );

            background-attachment: fixed;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button {
            font: inherit;
        }


        /* =========================================================
           ロゴ
        ========================================================= */

        .logo {
            position: fixed;

            top: 17px;
            left: 5%;

            z-index: 1000;
        }


        .logo img {
            display: block;

            width: auto;
            height: 78px;

            object-fit: contain;

            transition:
                transform 0.35s ease,
                filter 0.35s ease;
        }


        .logo img:hover {
            transform:
                scale(1.04)
                rotate(-1deg);
        }


        /* =========================================================
           三本線
        ========================================================= */

        .menu-button {
            position: fixed;

            top: 28px;
            right: 5%;

            width: 50px;
            height: 50px;

            border: none;

            background:
                rgba(255, 255, 255, 0.70);

            border-radius: 50%;

            cursor: pointer;

            z-index: 1200;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: var(--transition);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px rgba(21, 152, 184, 0.09);
        }


        .menu-button:hover {
            transform:
                translateY(-2px)
                scale(1.04);

            background:
                rgba(255, 255, 255, 0.90);

            box-shadow:
                0 12px 30px rgba(21, 152, 184, 0.13);
        }


        .menu-icon {
            width: 21px;
            height: 16px;

            position: relative;
        }


        .menu-icon span {
            position: absolute;

            left: 0;

            width: 100%;
            height: 2px;

            background: var(--text);

            border-radius: 5px;

            transition: var(--transition);
        }


        .menu-icon span:nth-child(1) {
            top: 0;
        }


        .menu-icon span:nth-child(2) {
            top: 7px;
        }


        .menu-icon span:nth-child(3) {
            top: 14px;
        }


        .menu-button.active .menu-icon span:nth-child(1) {
            top: 7px;

            transform: rotate(45deg);
        }


        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }


        .menu-button.active .menu-icon span:nth-child(3) {
            top: 7px;

            transform: rotate(-45deg);
        }


        /* =========================================================
           メニュー
        ========================================================= */

        .menu {
            position: fixed;

            inset: 0;

            z-index: 1100;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                rgba(248, 254, 255, 0.94);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            opacity: 0;
            visibility: hidden;

            transition: var(--transition);
        }


        .menu.active {
            opacity: 1;

            visibility: visible;
        }


        .menu-list {
            width: min(570px, 82%);

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .menu-list a {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            color: var(--text);

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.42);

            opacity: 0;

            transform: translateY(18px);

            transition: var(--transition);
        }


        .menu.active .menu-list a {
            opacity: 1;

            transform: translateY(0);
        }


        .menu.active .menu-list a:nth-child(1) {
            transition-delay: 0.05s;
        }


        .menu.active .menu-list a:nth-child(2) {
            transition-delay: 0.10s;
        }


        .menu.active .menu-list a:nth-child(3) {
            transition-delay: 0.15s;
        }


        .menu.active .menu-list a:nth-child(4) {
            transition-delay: 0.20s;
        }


        .menu.active .menu-list a:nth-child(5) {
            transition-delay: 0.25s;
        }


        .menu.active .menu-list a:nth-child(6) {
            transition-delay: 0.30s;
        }


        .menu-item-text {
            display: flex;

            align-items: baseline;

            gap: 13px;
        }


        .menu-jp {
            font-size: 20px;

            font-weight: 700;
        }


        .menu-en {
            color: rgba(21, 152, 184, 0.62);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 2.8px;

            line-height: 1;
        }


        .menu-arrow {
            color: var(--ocean);

            font-size: 19px;

            transition: var(--transition);
        }


        .menu-list a:hover {
            background:
                rgba(255, 255, 255, 0.82);

            transform:
                translateX(5px);
        }


        .menu-list a:hover .menu-arrow {
            transform:
                translateX(5px);
        }


        /* =========================================================
           ページ
        ========================================================= */

        main {
            width: min(1000px, 86%);

            margin: 0 auto;

            padding:
                170px 0
                120px;
        }


        /* =========================================================
           ページタイトル
        ========================================================= */

        .page-heading {
            text-align: center;

            margin-bottom: 70px;
        }


        .page-title-en {
            display: block;

            margin-bottom: 10px;

            color: var(--ocean);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 4px;
        }


        .page-title {
            color: var(--text);

            font-size:
                clamp(
                    30px,
                    5vw,
                    42px
                );

            font-weight: 800;

            line-height: 1.4;

            letter-spacing: -0.04em;
        }


        .page-description {
            max-width: 600px;

            margin:
                20px auto
                0;

            color: var(--text-soft);

            font-size: 13px;

            font-weight: 500;

            line-height: 2;
        }


        /* =========================================================
           メンバー一覧
        ========================================================= */

        .member-list {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        /* =========================================================
           メンバーカード
        ========================================================= */

        .member-card {
            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            min-height: 390px;

            padding:
                30px
                25px;

            border-radius: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.58
                );

            border:
                1px solid
                rgba(
                    40,
                    82,
                    100,
                    0.16
                );

            box-shadow:
                var(--soft-shadow);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: var(--transition);

            overflow: hidden;

            --card-color: #1598b8;
        }


        .member-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background: var(--card-color);

            opacity: 0;

            transition: var(--transition);
        }


        .member-card:hover {
            transform:
                translateY(-7px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.82
                );

            box-shadow:
                var(--shadow);
        }


        .member-card:hover::before {
            opacity: 1;
        }


        /* =========================================================
           画像
        ========================================================= */

        .member-image-wrap {
            width: 210px;
            height: 210px;

            margin-bottom: 24px;

            border-radius: 50%;

            overflow: hidden;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            box-shadow:
                0 10px 30px
                rgba(
                    21,
                    152,
                    184,
                    0.10
                );

            border: 4px solid var(--card-color);
        }


        .member-image {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform 0.5s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }


        .member-card:hover .member-image {
            transform:
                scale(1.06);
        }


        /* =========================================================
           番号
        ========================================================= */

        .member-number {
            margin-bottom: 5px;

            color: var(--card-color);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2.5px;
        }


        /* =========================================================
           名前
        ========================================================= */

        .member-name {
            color: var(--text);

            font-size: 23px;

            font-weight: 800;

            line-height: 1.5;
        }


        .member-role {
            margin-top: 3px;

            color: var(--text-faint);

            font-size: 11px;

            font-weight: 500;
        }


        .member-arrow {
            margin-top: 18px;

            color: var(--card-color);

            font-size: 18px;

            transition: var(--transition);
        }


        .member-card:hover .member-arrow {
            transform:
                translateX(7px);
        }


        /* =========================================================
           戻る
        ========================================================= */

        .back-button {
            display: flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            margin:
                55px auto
                0;

            padding:
                13px
                25px;

            border-radius: 100px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            border:
                1px solid
                rgba(
                    40,
                    82,
                    100,
                    0.13
                );

            color: var(--ocean);

            font-size: 13px;

            font-weight: 700;

            box-shadow:
                0 8px 24px
                rgba(
                    21,
                    152,
                    184,
                    0.06
                );

            transition: var(--transition);
        }


        .back-button span {
            margin-right: 10px;

            transition: var(--transition);
        }


        .back-button:hover {
            transform:
                translateY(-3px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );
        }


        .back-button:hover span {
            transform:
                translateX(-5px);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding:
                50px
                7%
                28px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.48
                );

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.72
                );

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }


        .footer-inner {
            width: min(1000px, 100%);

            margin: 0 auto;
        }


        .footer-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 40px;
        }


        .footer-name {
            color: var(--text);

            font-size: 19px;

            font-weight: 800;
        }


        .footer-copy {
            margin-top: 3px;

            color: var(--text-faint);

            font-size: 10px;

            font-weight: 500;
        }


        .footer-links {
            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

            gap: 17px;
        }


        .footer-links a {
            color: var(--text-soft);

            font-size: 11px;

            font-weight: 500;

            transition: var(--transition);
        }


        .footer-links a:hover {
            color: var(--ocean);
        }


        .footer-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 38px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(
                    21,
                    152,
                    184,
                    0.10
                );

            color: var(--text-faint);

            font-size: 9px;
        }


        /* =========================================================
           スマホ
        ========================================================= */

        @media (max-width: 800px) {

            .logo {
                top: 12px;
                left: 20px;
            }


            .logo img {
                height: 62px;
            }


            .menu-button {
                top: 18px;
                right: 20px;

                width: 44px;
                height: 44px;
            }


            main {
                width: 86%;

                padding:
                    135px 0
                    90px;
            }


            .page-heading {
                margin-bottom: 50px;
            }


            .member-list {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 14px;
            }


            .member-card {
                min-height: 330px;

                padding:
                    23px
                    15px;

                border-radius: 24px;
            }


            .member-image-wrap {
                width: 145px;
                height: 145px;

                margin-bottom: 18px;
            }


            .member-name {
                font-size: 18px;
            }


            .member-role {
                font-size: 9px;
            }


            .footer-top {
                flex-direction: column;

                align-items: center;

                text-align: center;
            }


            .footer-links {
                justify-content: center;
            }


            .footer-bottom {
                flex-direction: column;

                gap: 7px;

                text-align: center;
            }

        }


        /* =========================================================
           小さいスマホ
        ========================================================= */

        @media (max-width: 480px) {

            .logo img {
                height: 56px;
            }


            .menu-button {
                width: 40px;
                height: 40px;

                border-radius: 50%;
            }


            main {
                width: 88%;

                padding-top: 120px;
            }


            .page-title {
                font-size: 29px;
            }


            .page-description {
                font-size: 11px;
            }


            .member-list {
                grid-template-columns: 1fr;

                gap: 15px;
            }


            .member-card {
                min-height: 370px;

                padding:
                    28px
                    20px;
            }


            .member-image-wrap {
                width: 190px;
                height: 190px;
            }


            .member-name {
                font-size: 21px;
            }

        }

    </style>
</head>

    <!-- =========================================================
         JavaScript
    ========================================================= -->

    <script src="Mem.js"></script>


    <script>

        /* =========================================================
           メニュー
        ========================================================= */

        const menuButton =
            document.getElementById("menuButton");

        const menu =
            document.getElementById("menu");


        menuButton.addEventListener(
            "click",
            () => {

                menuButton.classList.toggle("active");

                menu.classList.toggle("active");


                if (
                    menu.classList.contains("active")
                ) {

                    document.body.style.overflow =
                        "hidden";

                } else {

                    document.body.style.overflow =
                        "";

                }

            }
        );


        /* =========================================================
           メニュークリック
        ========================================================= */

        document
            .querySelectorAll(".menu-list a")
            .forEach(link => {

                link.addEventListener(
                    "click",
                    () => {

                        menuButton.classList.remove(
                            "active"
                        );

                        menu.classList.remove(
                            "active"
                        );

                        document.body.style.overflow =
                            "";

                    }
                );

            });


        /* =========================================================
           メンバー表示
        ========================================================= */

        const memberList =
            document.getElementById("memberList");


        function createMemberCard(member, index) {

            const card =
                document.createElement("a");

            card.className =
                "member-card";

            card.href =
                "Member.html?id=" +
                encodeURIComponent(member.id);

            card.style.setProperty(
                "--card-color",
                member.color || "#1598b8"
            );


            card.innerHTML = `

                <div class="member-image-wrap">

                    <img
                        class="member-image"
                        src="${member.image}"
                        alt="${member.name}">

                </div>


                <div class="member-number">
                    ${String(index + 1).padStart(2, "0")}
                </div>


                <div class="member-name">
                    ${member.name}
                </div>


                <div class="member-role">
                    ${member.role}
                </div>


                <div class="member-arrow">
                    →
                </div>

            `;


            return card;

        }


        if (
            typeof MEMBERS !== "undefined" &&
            Array.isArray(MEMBERS)
        ) {

            MEMBERS.forEach(
                (member, index) => {

                    memberList.appendChild(
                        createMemberCard(
                            member,
                            index
                        )
                    );

                }
            );

        } else {

            memberList.innerHTML = `

                <p
                    style="
                        grid-column: 1 / -1;
                        text-align: center;
                        color: #9bb4bc;
                        padding: 60px 0;
                    "
                >
                    メンバー情報を読み込めませんでした。
                </p>

            `;

        }

    </script>
