<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>takoGATE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    overflow-x:hidden;
}

/* 背景 */

.bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
    radial-gradient(circle at top,#1e3a8a 0%,#0f172a 55%,#020617 100%);
}

.blur{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(130px);
    opacity:.25;
}

.b1{
    background:#3b82f6;
    top:-180px;
    left:-150px;
}

.b2{
    background:#06b6d4;
    bottom:-180px;
    right:-180px;
}

/* Header */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    position:sticky;
    top:0;
    backdrop-filter:blur(12px);
    background:rgba(15,23,42,.45);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:32px;
    font-weight:800;
    color:#38bdf8;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.25s;
}

nav a:hover{
    color:#38bdf8;
}

/* Hero */

.hero{

    min-height:88vh;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-align:center;
    padding:40px;
}

.hero h1{

    font-size:70px;
    font-weight:800;

}

.hero span{

    color:#38bdf8;

}

.hero p{

    margin-top:18px;
    color:#cbd5e1;
    max-width:700px;
    line-height:1.8;
    font-size:18px;

}

.buttons{

    display:flex;
    gap:15px;
    margin-top:40px;
    flex-wrap:wrap;
    justify-content:center;

}

.btn{

    padding:16px 34px;
    border-radius:14px;
    text-decoration:none;
    font-weight:700;
    transition:.25s;

}

.main{

    background:#38bdf8;
    color:#00111d;

}

.main:hover{

    transform:translateY(-4px);

}

.sub{

    border:1px solid rgba(255,255,255,.15);
    color:white;

}

.sub:hover{

    background:rgba(255,255,255,.08);

}

/* Cards */

.section{

    width:min(1200px,90%);
    margin:auto;
    padding:70px 0;

}

.title{

    font-size:38px;
    margin-bottom:35px;
    font-weight:800;

}

.grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:22px;

}

.card{

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:30px;
    transition:.3s;

}

.card:hover{

    transform:translateY(-8px);
    border-color:#38bdf8;

}

.icon{

    font-size:42px;

}

.card h3{

    margin:20px 0 10px;

}

.card p{

    color:#cbd5e1;
    line-height:1.7;

}

/* Footer */

footer{

    padding:40px;
    text-align:center;
    color:#94a3b8;
    border-top:1px solid rgba(255,255,255,.08);

}

@media(max-width:700px){

.hero h1{

font-size:46px;

}

header{

flex-direction:column;
gap:18px;

}

}

</style>

</head>
<body>

<div class="bg"></div>

<div class="blur b1"></div>
<div class="blur b2"></div>

<header>

<div class="logo">🐙 takoGATE</div>

<nav>

<a href="">Home</a>
<a href="">Tools</a>
<a href="">Games</a>
<a href="">Study</a>

</nav>

</header>

<section class="hero">

<h1>Welcome to <span>takoGATE</span></h1>

<p>

遊べる、使える、学べる。
便利なツール・ミニゲーム・勉強コンテンツを
1つにまとめたWebサイト。

</p>

<div class="buttons">

<a class="btn main" href="">はじめる</a>

<a class="btn sub" href="">コンテンツを見る</a>

</div>

</section>

<section class="section">

<div class="title">

人気カテゴリー

</div>

<div class="grid">

<div class="card">

<div class="icon">🛠️</div>

<h3>便利ツール</h3>

<p>

文字数カウント、QRコード生成、
カラーコード変換など。

</p>

</div>

<div class="card">

<div class="icon">🎮</div>

<h3>ミニゲーム</h3>

<p>

ブラウザで遊べるゲームを
どんどん追加予定。

</p>

</div>

<div class="card">

<div class="icon">📚</div>

<h3>勉強</h3>

<p>

一問一答や学習ツールで
効率よく学べます。

</p>

</div>

<div class="card">

<div class="icon">✨</div>

<h3>ジェネレーター</h3>

<p>

名前生成やルーレット、
ガチャなどのコンテンツ。

</p>

</div>

</div>

</section>

<footer>

© 2026 takoGATE

</footer>

</body>
</html>
