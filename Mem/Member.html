<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>メンバー | MillionIndex</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           基本設定
        ========================================================= */

        :root {
            --ocean: #1598b8;
            --ocean-blue: #54c8dc;
            --ocean-light: #9ce8ed;
            --mint: #b9eee4;

            --text: #285264;
            --text-soft: #6b8994;
            --text-faint: #9bb4bc;

            --white: #ffffff;

            --shadow:
                0 15px 45px rgba(21, 152, 184, 0.09);

            --soft-shadow:
                0 8px 28px rgba(21, 152, 184, 0.07);

            --transition:
                all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family:
                "Noto Sans JP",
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            color: var(--text);

            line-height: 1.8;

            overflow-x: hidden;

            background: #ffffff;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           ロゴ
        ========================================================= */

        .logo {
            position: fixed;

            top: 17px;
            left: 5%;

            z-index: 1000;
        }


        .logo img {
            display: block;

            width: auto;
            height: 78px;

            object-fit: contain;
        }


        /* =========================================================
           メニュー
        ========================================================= */

        .menu-button {
            position: fixed;

            top: 28px;
            right: 5%;

            width: 50px;
            height: 50px;

            border: none;

            background:
                rgba(255, 255, 255, 0.70);

            border-radius: 50%;

            cursor: pointer;

            z-index: 1200;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: var(--transition);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 25px rgba(21, 152, 184, 0.09);
        }


        .menu-button:hover {
            transform:
                translateY(-2px)
                scale(1.04);

            background:
                rgba(255, 255, 255, 0.90);
        }


        .menu-icon {
            width: 21px;
            height: 16px;

            position: relative;
        }


        .menu-icon span {
            position: absolute;

            left: 0;

            width: 100%;
            height: 2px;

            background: var(--text);

            border-radius: 5px;

            transition: var(--transition);
        }


        .menu-icon span:nth-child(1) {
            top: 0;
        }


        .menu-icon span:nth-child(2) {
            top: 7px;
        }


        .menu-icon span:nth-child(3) {
            top: 14px;
        }


        .menu-button.active .menu-icon span:nth-child(1) {
            top: 7px;

            transform: rotate(45deg);
        }


        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }


        .menu-button.active .menu-icon span:nth-child(3) {
            top: 7px;

            transform: rotate(-45deg);
        }


        .menu {
            position: fixed;

            inset: 0;

            z-index: 1100;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                rgba(248, 254, 255, 0.94);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            opacity: 0;
            visibility: hidden;

            transition: var(--transition);
        }


        .menu.active {
            opacity: 1;

            visibility: visible;
        }


        .menu-list {
            width: min(570px, 82%);

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .menu-list a {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            color: var(--text);

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.42);

            transition: var(--transition);
        }


        .menu-list a:hover {
            background:
                rgba(255, 255, 255, 0.82);

            transform:
                translateX(5px);
        }


        .menu-item-text {
            display: flex;

            align-items: baseline;

            gap: 13px;
        }


        .menu-jp {
            font-size: 20px;

            font-weight: 700;
        }


        .menu-en {
            color: rgba(21, 152, 184, 0.62);

            font-family: Arial, Helvetica, sans-serif;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 2.8px;
        }


        .menu-arrow {
            color: var(--ocean);

            font-size: 19px;
        }


        /* =========================================================
           メイン
        ========================================================= */

        main {
            width: min(900px, 86%);

            margin: 0 auto;

            padding:
                175px 0
                120px;
        }


        /* =========================================================
           メンバー詳細
        ========================================================= */

        .member-detail {
            padding:
                55px
                45px;

            border-radius: 40px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.58
                );

            border:
                1px solid
                rgba(
                    40,
                    82,
                    100,
                    0.16
                );

            box-shadow:
                var(--shadow);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            text-align: center;
        }


        .member-number {
            margin-bottom: 8px;

            color: var(--ocean);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 3px;
        }


        .member-image-wrap {
            width: 280px;
            height: 280px;

            margin:
                0 auto
                28px;

            border-radius: 50%;

            overflow: hidden;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            box-shadow:
                0 15px 40px
                rgba(
                    21,
                    152,
                    184,
                    0.12
                );
        }


        .member-image {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        .member-name {
            color: var(--text);

            font-size:
                clamp(
                    30px,
                    5vw,
                    44px
                );

            font-weight: 800;

            line-height: 1.4;
        }


        .member-role {
            margin-top: 5px;

            color: var(--text-faint);

            font-size: 12px;

            font-weight: 500;
        }


        /* =========================================================
           プロフィール
        ========================================================= */

        .profile {
            max-width: 650px;

            margin:
                55px auto
                0;

            padding-top: 45px;

            border-top:
                1px solid
                rgba(
                    21,
                    152,
                    184,
                    0.12
                );
        }


        .profile-title {
            margin-bottom: 20px;

            color: var(--ocean);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 3px;
        }


        .profile-text {
            color: var(--text-soft);

            font-size: 13px;

            font-weight: 500;

            line-height: 2.2;
        }


        /* =========================================================
           戻る
        ========================================================= */

        .back-buttons {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 45px;
        }


        .back-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                13px
                25px;

            border-radius: 100px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            border:
                1px solid
                rgba(
                    40,
                    82,
                    100,
                    0.13
                );

            color: var(--ocean);

            font-size: 13px;

            font-weight: 700;

            transition: var(--transition);
        }


        .back-button:hover {
            transform:
                translateY(-3px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );
        }


        /* =========================================================
           エラー
        ========================================================= */

        .error {
            text-align: center;

            padding:
                100px
                20px;

            color: var(--text-soft);
        }



        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding:
                70px
                7%
                40px;

            background:
                linear-gradient(
                    180deg,
                    #c8f0ee 0%,
                    #aee8e5 35%,
                    #95dfdc 100%
                );

            border-top:
                1px solid
                rgba(
                    21,
                    152,
                    184,
                    0.22
                );
        }


        .footer-inner {
            width: min(420px, 88%);

            margin: 0 auto;
        }


        .footer-brand {
            text-align: center;

            margin-bottom: 42px;
        }


        .footer-name {
            color: var(--text);

            font-size: 22px;

            font-weight: 800;
        }


        .footer-copy {
            margin-top: 6px;

            color: var(--text-faint);

            font-size: 11px;

            font-weight: 500;
        }


        .footer-nav {
            display: flex;

            flex-direction: column;

            gap: 4px;

            margin-bottom: 48px;
        }


        .footer-nav a {
            display: flex;

            align-items: baseline;

            justify-content: flex-start;

            gap: 14px;

            padding: 12px 8px;

            color: var(--text);

            border-radius: 12px;

            background: transparent;
        }


        .footer-nav-jp {
            font-size: 15px;

            font-weight: 700;

            color: var(--text);

            min-width: 120px;

            text-align: left;
        }


        .footer-nav-en {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2.2px;

            color: var(--text-soft);

            text-align: left;
        }


        .footer-bottom {
            text-align: center;

            padding-top: 22px;

            border-top:
                1px solid
                rgba(
                    21,
                    152,
                    184,
                    0.18
                );

            color: var(--text-faint);

            font-size: 10px;
        }


        .footer-bottom span + span {
            margin-left: 12px;
        }


        /* =========================================================
           スマホ
        ========================================================= */

        @media (max-width: 800px) {

            .logo {
                top: 12px;
                left: 20px;
            }


            .logo img {
                height: 62px;
            }


            .menu-button {
                top: 18px;
                right: 20px;

                width: 44px;
                height: 44px;
            }


            main {
                width: 88%;

                padding:
                    135px 0
                    80px;
            }


            .member-detail {
                padding:
                    40px
                    22px;

                border-radius: 30px;
            }


            .member-image-wrap {
                width: 220px;
                height: 220px;
            }


            .footer-nav-jp {
                font-size: 14px;

                min-width: 100px;
            }


            .footer-nav-en {
                font-size: 10px;

                letter-spacing: 1.8px;
            }

        }


        @media (max-width: 480px) {

            .logo img {
                height: 56px;
            }


            .menu-button {
                width: 40px;
                height: 40px;
            }


            main {
                padding-top: 120px;
            }


            .member-detail {
                padding:
                    32px
                    17px;
            }


            .member-image-wrap {
                width: 190px;
                height: 190px;
            }


            .profile-text {
                font-size: 11px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================================
         ロゴ
    ========================================================= -->

    <div class="logo">

            <img
                src="../Mil.png"

    <!-- =========================================================

    ========================================================= -->

        <div class="menu-icon">

    <!-- =========================================================

    ========================================================= -->

    <div class="menu" id="menu">

        <nav class="menu-list">

            <a href="../index.html">

                    </span>

                </div>

                </span>

            </a>


            <a href="../index.html#about">

                <div class="menu-item-text">

                    <span class="menu-jp">

                    </span>

                    <span class="menu-en">

                    </span>

                </div>

                <span class="menu-arrow">

                </span>

            </a>


            <a href="../index.html#service">

                <div class="menu-item-text">

                    <span class="menu-jp">
                        事業内容
                    </span>

                    <span class="menu-en">
                        S E R V I C E
                    </span>

                </div>

                <span class="menu-arrow">
                    →
                </span>

            </a>


            <a href="../index.html#tools">

                <div class="menu-item-text">

                    <span class="menu-jp">

                    </span>

                    <span class="menu-en">
                        T O O L S
                    </span>

                </div>

                <span class="menu-arrow">

                </span>

            </a>


            <a href="MenList.html">

                <div class="menu-item-text">

                    </span>

    </div>


    <!-- =========================================================
         メイン
    ========================================================= -->

    <main>

        <div id="memberDetail">

            <div class="error">
                メンバー情報を読み込んでいます……
            </div>

        </div>

    </main>



    <!-- =========================================================
         FOOTER
    ========================================================= -->

    <footer>


        <div class="footer-inner">


            <div class="footer-brand">

                <div class="footer-name">
                    MillionIndex
                </div>

                <div class="footer-copy">
                    すべての「便利」を、ひとつの場所へ。
                </div>

            </div>


            <nav class="footer-nav">

                <a href="../index.html">
                    <span class="footer-nav-jp">トップ</span>
                    <span class="footer-nav-en">TOP</span>
                </a>

                <a href="../index.html#about">
                    <span class="footer-nav-jp">理念</span>
                    <span class="footer-nav-en">ABOUT</span>
                </a>

                <a href="../index.html#service">
                    <span class="footer-nav-jp">事業内容</span>
                    <span class="footer-nav-en">SERVICE</span>
                </a>

                <a href="../index.html#tools">
                    <span class="footer-nav-jp">便利ツール</span>

                    <span class="footer-nav-en">MEMBERS</span>
                </a>

    <!-- =========================================================
         JavaScript
    ========================================================= -->

    <script src="Mem.js"></script>


    <script>

        /* =========================================================
           メニュー
        ========================================================= */

        const menuButton =
            document.getElementById("menuButton");

        const menu =
            document.getElementById("menu");


        menuButton.addEventListener(
            "click",
            () => {

                menuButton.classList.toggle("active");

                menu.classList.toggle("active");


                if (
                    menu.classList.contains("active")
                ) {

                    document.body.style.overflow =
                        "hidden";

                } else {

                    document.body.style.overflow =
                        "";

                }

            }
        );


        document
            .querySelectorAll(".menu-list a")
            .forEach(link => {

                link.addEventListener(
                    "click",
                    () => {

                        menuButton.classList.remove(
                            "active"
                        );

                        menu.classList.remove(
                            "active"
                        );

                        document.body.style.overflow =
                            "";

                    }
                );

            });


        /* =========================================================
           メンバー詳細表示
        ========================================================= */

        const detail =
            document.getElementById("memberDetail");


        const params =
            new URLSearchParams(
                window.location.search
            );


        const memberId =
            params.get("id");


        if (
            typeof MEMBERS === "undefined" ||
            !Array.isArray(MEMBERS)
        ) {

            detail.innerHTML = `

                <div class="error">

                    メンバー情報を読み込めませんでした。

                </div>

            `;

        } else {

            const member =
                MEMBERS.find(
                    item =>
                        String(item.id) ===
                        String(memberId)
                );


            if (!member) {

                detail.innerHTML = `

                    <div class="error">

                        <h1>
                            メンバーが見つかりません
                        </h1>

                        <p>
                            指定されたメンバー情報は存在しません。
                        </p>

                        <div class="back-buttons">

                            <a
                                href="MenList.html"
                                class="back-button">

                                ← メンバー一覧へ

                            </a>

                        </div>

                    </div>

                `;

            } else {

                const memberIndex =
                    MEMBERS.indexOf(member);


                detail.innerHTML = `

                    <section class="member-detail">

                        <div class="member-number">
                            ${String(memberIndex + 1).padStart(2, "0")}
                        </div>


                        <div class="member-image-wrap">

                            <img
                                class="member-image"
                                src="${member.image}"
                                alt="${member.name}">

                        </div>


                        <h1 class="member-name">
                            ${member.name}
                        </h1>


                        <div class="member-role">
                            ${member.role}
                        </div>


                        <div class="profile">

                            <div class="profile-title">
                                P R O F I L E
                            </div>

                            <p class="profile-text">
                                ${member.description || "プロフィール情報は準備中です。"}
                            </p>

                        </div>


                        <div class="back-buttons">

                            <a
                                href="MenList.html"
                                class="back-button">

                                ← メンバー一覧

                            </a>


                            <a
                                href="../index.html"
                                class="back-button">

                                トップへ

                            </a>

                        </div>

                    </section>

                `;

            }

        }

    </script>

</body>
